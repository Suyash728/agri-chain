# Pings the Render backend's /health every 10 minutes:
#  * keeps the free Render web service from spinning down (15 min idle limit)
#  * /health runs a SELECT 1, so the free Supabase project never hits its 7-day inactivity pause
# Setup: repo Settings -> Secrets and variables -> Actions -> Variables -> add BACKEND_URL
# (e.g. https://agrichain-api.onrender.com). Without it the job is skipped.
# Note: GitHub disables scheduled workflows after 60 days without repository activity.
name: keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    if: ${{ vars.BACKEND_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health (tolerates a cold start)
        run: |
          for attempt in 1 2 3; do
            if curl -fsS --max-time 90 "${{ vars.BACKEND_URL }}/health"; then exit 0; fi
            echo "attempt $attempt failed; retrying"; sleep 20
          done
          exit 1
